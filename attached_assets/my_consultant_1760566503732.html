{% extends "includes/base.html" %}
{% block title %}My Consultant - AI JobBot{% endblock %}
{% block content %}
<div class="dashboard-layout">
    {% include 'includes/sidebar.html' %}
    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">🤖 Meet Zby</h1>
            <p class="page-subtitle">{{ t.consultant_subtitle }}</p>
        </div>
        
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <div class="message message-bot">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <p>{{ t.zby_greeting }}</p>
                    </div>
                </div>
            </div>
            
            <form id="chat-form" class="chat-form">
                <input type="text" id="chat-input" placeholder="Ask me anything about your career..." required>
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
        {% include 'includes/footer.html' %}
    </main>
</div>
<script src="{{ url_for('static', filename='consultant.js') }}"></script>
{% endblock %}
