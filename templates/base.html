<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI JobBot{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar glass">
        <div class="container nav-content">
            <a href="/" class="logo-link">
                <div class="logo neon-logo">
                    <span class="logo-text">AI JobBot</span>
                </div>
            </a>
            <div class="nav-links">
                {% if user %}
                    <a href="/dashboard" class="nav-link">{{ t.dashboard }}</a>
                    <a href="/consultant" class="nav-link">{{ t.my_consultant }}</a>
                    <a href="/jobs" class="nav-link">{{ t.job_search }}</a>
                    <a href="/applications" class="nav-link">{{ t.applications }}</a>
                    <a href="/logout" class="nav-link">{{ t.logout }}</a>
                {% else %}
                    <a href="/login" class="nav-link">{{ t.login }}</a>
                    <a href="/register" class="nav-link">{{ t.register }}</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
