<nav class="sidebar">
    <div class="sidebar-header">
        <div class="logo-container">
            <!-- Animated 3-circle logo -->
            <svg class="logo" width="120" height="40" viewBox="0 0 120 40">
                <circle class="logo-circle logo-circle-1" cx="15" cy="20" r="12" fill="#E53E3E"/>
                <circle class="logo-circle logo-circle-2" cx="45" cy="20" r="12" fill="#00F0FF"/>
                <circle class="logo-circle logo-circle-3" cx="75" cy="20" r="12" fill="#00FF88"/>
            </svg>
            <h1 class="logo-text">AI JobBot</h1>
        </div>
    </div>
    
    <div class="sidebar-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>{{ t.dashboard }}</span>
        </a>
        
        <a href="{{ url_for('cv_upload') }}" class="nav-item {% if request.endpoint == 'cv_upload' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <span>{{ t.cv_upload }}</span>
        </a>
        
        <a href="{{ url_for('job_search') }}" class="nav-item {% if request.endpoint == 'job_search' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <span>{{ t.job_search }}</span>
        </a>
        
        <a href="{{ url_for('letter_generator') }}" class="nav-item {% if request.endpoint == 'letter_generator' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>{{ t.letter_generator }}</span>
        </a>
        
        <a href="{{ url_for('applications') }}" class="nav-item {% if request.endpoint == 'applications' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            <span>{{ t.applications }}</span>
        </a>
        
        <a href="{{ url_for('activity') }}" class="nav-item {% if request.endpoint == 'activity' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            <span>{{ t.activity }}</span>
        </a>
        
        <a href="{{ url_for('my_consultant') }}" class="nav-item {% if request.endpoint == 'my_consultant' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <span>{{ t.my_consultant }}</span>
        </a>
    </div>
    
    <div class="sidebar-footer">
        {% if user %}
        <div class="user-card">
            <div class="user-avatar">{{ user.username[0].upper() }}</div>
            <div class="user-info">
                <div class="user-name">{{ user.username }}</div>
                <div class="user-credits">{{ user.credits }} {{ t.credits }}</div>
            </div>
        </div>
        {% endif %}
        
        <div class="language-switcher">
            <a href="{{ url_for('set_language', lang='en') }}" class="lang-btn {% if current_lang == 'en' %}active{% endif %}">EN</a>
            <a href="{{ url_for('set_language', lang='fr') }}" class="lang-btn {% if current_lang == 'fr' %}active{% endif %}">FR</a>
        </div>
        
        <a href="{{ url_for('logout') }}" class="btn-logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>{{ t.logout }}</span>
        </a>
    </div>
</nav>
